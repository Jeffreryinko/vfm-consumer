name: 역사 글 사진 후보 찾기 (필요할 때만)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/kick/images']
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/find_images.py
      - run: |
          git config user.name "consumer-robot"; git config user.email "robot@users.noreply.github.com"
          git add data/learn/img_candidates.json; git commit -q -m "사진 후보" || exit 0
          for i in 1 2 3; do (git pull -q --rebase -X theirs --autostash || (git rebase --abort; false)) && git push -q && break || sleep 10; done
